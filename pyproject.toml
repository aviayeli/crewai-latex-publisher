[project]
name = "crewai-latex-publisher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crewai[anthropic]>=1.14.6",
    "langchain>=1.3.2",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "pydantic-settings>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
addopts = "--cov=src"
pythonpath = ["."]
markers = ["slow: end-to-end tests requiring API key and lualatex binary"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewai-latex-publisher"
version = "0.1.0"
description = "Multi-agent CrewAI pipeline that compiles a Hebrew-English academic book to PDF"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crewai[anthropic]>=1.14.6",
    "langchain>=1.3.2",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
latex-publisher = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pymupdf>=1.24.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 88
exclude = ["latex_output/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "N"]

[tool.pytest.ini_options]
addopts = "--cov=src -m 'not slow'"
pythonpath = ["."]
markers = ["slow: end-to-end tests requiring API key and lualatex binary"]
